# Render blueprint: deploys the Node API and the React website as two SEPARATE services.
# Render dashboard → New → Blueprint → pick this repo. Fill the env vars marked sync:false.
# Keep the API in the Singapore region: the Neon database is in ap-southeast-1 (Singapore).
services:
  - type: web
    name: rry-erp-api
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci && npm run build:api
    preDeployCommand: npm run db:deploy
    startCommand: npm start --workspace apps/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL # Neon pooled connection string
        sync: false
      - key: DIRECT_URL # Neon direct connection string (migrations)
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-southeast-1
      - key: S3_BUCKET
        value: static
      - key: CORS_ORIGINS # your website URL + the mobile app origins
        value: https://rry-erp-web.onrender.com,https://localhost,capacitor://localhost

  - type: web
    name: rry-erp-web
    runtime: static
    buildCommand: npm ci && npm run build:web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL # e.g. https://rry-erp-api.onrender.com/api
        sync: false
